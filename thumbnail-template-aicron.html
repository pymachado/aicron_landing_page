<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AICRON — Thumbnail Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #060810;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 24px 60px;
      gap: 20px;
    }

    /* ── Controls ────────────────────────────────────────── */
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .format-switcher {
      display: flex;
      gap: 6px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 4px;
    }

    .fmt-btn {
      padding: 7px 16px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: rgba(255,255,255,0.4);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .fmt-btn.active {
      border-color: #3CB043;
      color: #3CB043;
      background: rgba(60,176,67,0.1);
    }
    .fmt-btn:hover:not(.active) {
      color: rgba(255,255,255,0.7);
      border-color: rgba(255,255,255,0.15);
    }

    .dl-btn {
      padding: 8px 20px;
      background: #3CB043;
      border: none;
      border-radius: 7px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
    }
    .dl-btn:hover { background: #2ea038; }
    .dl-btn.loading { opacity: 0.5; pointer-events: none; }

    .hint {
      font-size: 11px;
      color: rgba(255,255,255,0.22);
      letter-spacing: 0.3px;
      margin-top: -10px;
    }

    /* ── Canvas wrapper ──────────────────────────────────── */
    .canvas-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    /* ── Canvas (native pixel size, scaled by JS) ───────── */
    .canvas {
      position: relative;
      overflow: hidden;
      background: #0b0c17;
      transform-origin: top left;
    }

    /* ── Glow layers ─────────────────────────────────────── */
    .glow {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }
    .glow-primary {
      width: 1200px; height: 1200px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle 600px at center, rgba(60,176,67,0.14) 0%, transparent 70%);
    }
    .glow-secondary {
      width: 1400px; height: 700px;
      bottom: -250px; left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(22,121,189,0.09) 0%, transparent 70%);
    }

    /* ── Grid texture ────────────────────────────────────── */
    .grid-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* ── Particles ───────────────────────────────────────── */
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      overflow: hidden;
    }

    /* ── N Lettermark ────────────────────────────────────── */
    .n-wrap {
      position: absolute;
      z-index: 4;
    }
    .n-glow {
      position: absolute;
      inset: -30px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(60,176,67,0.55) 0%, rgba(60,176,67,0.18) 40%, transparent 70%);
      filter: blur(45px);
      pointer-events: none;
    }
    .n-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── Logo AICRON ─────────────────────────────────────── */
    .logo {
      position: absolute;
      z-index: 5;
      pointer-events: none;
    }

    /* ── Text block ──────────────────────────────────────── */
    .text-block {
      position: absolute;
      z-index: 6;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .category-pill {
      display: inline-block;
      align-self: flex-start;
      padding: 12px 32px;
      border-radius: 100px;
      border: 1.5px solid rgba(60,176,67,0.45);
      font-family: 'Inter', sans-serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      outline: none;
      cursor: text;
      white-space: nowrap;
    }

    .title {
      font-family: 'Montserrat', sans-serif;
      font-size: 96px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.08;
      letter-spacing: -2px;
      outline: none;
      cursor: text;
    }

    .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 40px;
      font-weight: 400;
      color: rgba(255,255,255,0.42);
      line-height: 1.5;
      outline: none;
      cursor: text;
    }

    [contenteditable]:focus { outline: none; }
    [contenteditable]:empty::before {
      content: attr(data-placeholder);
      color: rgba(255,255,255,0.18);
      pointer-events: none;
      font-style: italic;
    }

    /* ══════════════════════════════════════════════════════
       FORMAT LAYOUTS — [data-fmt] attribute selectors
       ══════════════════════════════════════════════════════ */

    /* ─── 9:16 ──────────────────────────────────────────── */
    [data-fmt="9x16"] .logo {
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      height: 60px;
      width: auto;
    }
    [data-fmt="9x16"] .n-wrap {
      width: 500px; height: 500px;
      top: 44%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    [data-fmt="9x16"] .text-block {
      bottom: 148px;
      left: 50%;
      transform: translateX(-50%);
      width: 880px;
      text-align: center;
      align-items: center;
    }
    [data-fmt="9x16"] .category-pill { align-self: center; }

    /* ─── 1:1 ───────────────────────────────────────────── */
    [data-fmt="1x1"] .logo {
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      height: 54px;
      width: auto;
    }
    [data-fmt="1x1"] .n-wrap {
      width: 480px; height: 480px;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    [data-fmt="1x1"] .text-block {
      top: 62%;
      left: 50%;
      transform: translateX(-50%);
      width: 840px;
      text-align: center;
      align-items: center;
      gap: 20px;
    }
    [data-fmt="1x1"] .category-pill {
      align-self: center;
      font-size: 24px;
      padding: 10px 28px;
    }
    [data-fmt="1x1"] .title { font-size: 88px; }
    [data-fmt="1x1"] .subtitle { font-size: 36px; }

    /* ─── 16:9 ──────────────────────────────────────────── */
    [data-fmt="16x9"] .logo {
      bottom: 72px;
      left: 80px;
      height: 50px;
      width: auto;
    }
    [data-fmt="16x9"] .n-wrap {
      width: 500px; height: 500px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    [data-fmt="16x9"] .text-block {
      bottom: 100px;
      right: 80px;
      width: 680px;
      text-align: right;
      align-items: flex-end;
      gap: 20px;
    }
    [data-fmt="16x9"] .category-pill {
      align-self: flex-end;
      font-size: 22px;
      padding: 8px 24px;
      letter-spacing: 2.5px;
    }
    [data-fmt="16x9"] .title { font-size: 80px; letter-spacing: -1.5px; }
    [data-fmt="16x9"] .subtitle { font-size: 34px; }
  </style>
</head>

  <script>
    const FORMATS = {
      '9x16':  { w: 1080, h: 1920 },
      '1x1':   { w: 1080, h: 1080 },
      '16x9':  { w: 1920, h: 1080 }
    };

    let currentFmt = '9x16';
    let currentScale = 1;

    function computeScale(w, h) {
      const availW = window.innerWidth - 48;
      const availH = window.innerHeight - 120;
      return Math.min(availW / w, availH / h, 1);
    }

    function spawnParticles(count) {
      const container = document.getElementById('particles');
      container.innerHTML = '';
      const colors = ['#1679bd', '#3CB043', '#FFA500'];
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        const size = (3 + Math.random() * 2.2).toFixed(1);
        const opacity = (0.10 + Math.random() * 0.18).toFixed(2);
        p.style.cssText = [
          'position:absolute',
          `width:${size}px`,
          `height:${size}px`,
          'border-radius:50%',
          `background:${colors[i % 3]}`,
          `left:${(4 + Math.random() * 92).toFixed(1)}%`,
          `top:${(4 + Math.random() * 92).toFixed(1)}%`,
          `opacity:${opacity}`,
          'filter:blur(1px)',
          'pointer-events:none'
        ].join(';');
        container.appendChild(p);
      }
    }

    function applyFormat(fmt) {
      const { w, h } = FORMATS[fmt];
      const scale = computeScale(w, h);
      currentScale = scale;

      const canvas = document.getElementById('canvas');
      const wrapper = document.getElementById('canvas-wrapper');

      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      canvas.style.transform = `scale(${scale})`;
      canvas.style.transformOrigin = 'top left';
      canvas.dataset.fmt = fmt;

      wrapper.style.width  = (w * scale) + 'px';
      wrapper.style.height = (h * scale) + 'px';

      spawnParticles(15);

      document.querySelectorAll('.fmt-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.fmt === fmt);
      });

      currentFmt = fmt;
    }

    function downloadThumbnail() {
      const btn    = document.getElementById('btn-download');
      const canvas = document.getElementById('canvas');
      const { w, h } = FORMATS[currentFmt];
      const filename = `aicron-thumbnail-${currentFmt}.png`;

      btn.classList.add('loading');
      btn.textContent = 'Generando...';

      // Reset to native size for capture
      canvas.style.transform = 'scale(1)';
      canvas.style.transformOrigin = 'top left';

      html2canvas(canvas, {
        scale: 2,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#0b0c17',
        width:  w,
        height: h,
        windowWidth:  w,
        windowHeight: h,
        logging: false,
      }).then(outputCanvas => {
        // Restore visual scale
        canvas.style.transform = `scale(${currentScale})`;

        const link = document.createElement('a');
        link.download = filename;
        link.href = outputCanvas.toDataURL('image/png');
        link.click();

        btn.classList.remove('loading');
        btn.textContent = 'Descargado ✓';
        setTimeout(() => { btn.textContent = '\u2193 Exportar PNG'; }, 2800);
      }).catch(() => {
        canvas.style.transform = `scale(${currentScale})`;
        btn.classList.remove('loading');
        btn.textContent = '\u2193 Exportar PNG';
        alert('Error al exportar. Intenta de nuevo.');
      });
    }

    document.querySelectorAll('.fmt-btn').forEach(btn => {
      btn.addEventListener('click', () => applyFormat(btn.dataset.fmt));
    });

    document.getElementById('btn-download').addEventListener('click', downloadThumbnail);

    window.addEventListener('resize', () => applyFormat(currentFmt));

    applyFormat('9x16');
  </script>
